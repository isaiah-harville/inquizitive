[package]
name = "inquizitive"
version = "0.1.1"
description = "Offline-first, open-source study app"
authors = ["Inquizitive contributors"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "inquizitive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"
thiserror = "2.0.21"
tauri-plugin-http = "2.9.0"

[dev-dependencies]
tempfile = "3.27.0"

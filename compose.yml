# Inquizitive, hosted: app + PostgreSQL + S3-compatible object storage (SeaweedFS).
# This is the same shape as a clustered deployment: the app is stateless and can
# be scaled (`docker compose up -d --scale app=3` behind a load balancer).
#
#   cp .env.example .env    # then edit secrets
#   docker compose up -d --build
#   open http://localhost:3000  (the first account you create becomes the admin)

services:
  app:
    build: .
    image: inquizitive:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-inquizitive}:${POSTGRES_PASSWORD:-inquizitive}@db:5432/${POSTGRES_DB:-inquizitive}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: ${S3_BUCKET:-inquizitive}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-inquizitive}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-inquizitive-secret}
      S3_FORCE_PATH_STYLE: "true"
      AUTH_MODE: ${AUTH_MODE:-local}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_URL: ${APP_URL:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}
      OIDC_ADMIN_VALUE: ${OIDC_ADMIN_VALUE:-}
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inquizitive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inquizitive}
      POSTGRES_DB: ${POSTGRES_DB:-inquizitive}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    configs:
      - source: seaweed-s3
        target: /etc/seaweedfs/s3.json
    volumes:
      - s3-data:/data

configs:
  seaweed-s3:
    content: |
      {"identities":[{"name":"inquizitive","credentials":[{"accessKey":"${S3_ACCESS_KEY_ID:-inquizitive}","secretKey":"${S3_SECRET_ACCESS_KEY:-inquizitive-secret}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}

volumes:
  db-data:
  s3-data:

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "inquizitive.fullname" . }}
  labels:
    {{- include "inquizitive.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.database.url }}
  DATABASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.storage.s3.accessKeyId }}
  S3_ACCESS_KEY_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.storage.s3.secretAccessKey }}
  S3_SECRET_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.admin.password }}
  ADMIN_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.oidc.clientSecret }}
  OIDC_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
